<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FitAI — Profile</title>
<link rel="stylesheet" href="styles.css">
<script src="store.js"></script>
<script src="api-client.js"></script>
</head>
<body>
<div class="screen" style="overflow: hidden;">

  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 76px; overflow-y: auto; padding: 56px 24px 24px; display: flex; flex-direction: column; gap: 24px;">

    <div style="display: flex; align-items: center; gap: 14px;">
      <div id="initial" style="width: 56px; height: 56px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: var(--lime);">F</div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div id="name" style="font-size: 18px; font-weight: 700;">FitAI User</div>
        <div id="email" style="font-size: 13px; color: var(--text-secondary);">—</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 1px; background: var(--border); border-radius: 14px; overflow: hidden; border: 1px solid var(--border);">
      <div style="display: flex; align-items: center; justify-content: space-between; background: var(--surface); padding: 16px;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="font-size: 15px; font-weight: 500; color: var(--text-tertiary);">Goals</div>
            <div style="font-size: 10px; font-weight: 700; color: var(--text-tertiary); background: var(--surface-2); border-radius: 999px; padding: 2px 7px;">FUTURE</div>
          </div>
          <div id="goalSummary" style="font-size: 12px; color: var(--text-secondary);">Not set yet</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3A3C40" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <a href="Preferences.html?from=profile" style="display: flex; align-items: center; justify-content: space-between; background: var(--surface); padding: 16px;">
        <div style="font-size: 15px; font-weight: 500;">Preferences</div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      <a href="Progress.html" style="display: flex; align-items: center; justify-content: space-between; background: var(--surface); padding: 16px;">
        <div style="font-size: 15px; font-weight: 500;">Workout History</div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      <div style="display: flex; align-items: center; justify-content: space-between; background: var(--surface); padding: 16px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="font-size: 15px; font-weight: 500; color: var(--text-tertiary);">Notifications</div>
          <div style="font-size: 10px; font-weight: 700; color: var(--text-tertiary); background: var(--surface-2); border-radius: 999px; padding: 2px 7px;">FUTURE</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3A3C40" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; background: var(--surface); padding: 16px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="font-size: 15px; font-weight: 500; color: var(--text-tertiary);">Settings</div>
          <div style="font-size: 10px; font-weight: 700; color: var(--text-tertiary); background: var(--surface-2); border-radius: 999px; padding: 2px 7px;">FUTURE</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3A3C40" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="Home.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>
    <a href="WorkoutDiscovery.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 9v6M20 9v6M7 7v10M17 7v10M2 12h3M19 12h3"/></svg>Workouts</a>
    <a href="Progress.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Progress</a>
    <a href="AICoach.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8L12 2z"/></svg>AI Coach</a>
    <a href="Profile.html" class="active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>Profile</a>
  </nav>

</div>
<script>
  var saved = window.FitAI ? window.FitAI.get().profile : {};
  var current = { name: saved.name || '', email: saved.email || '', goal: saved.fitnessGoal || null, level: saved.fitnessLevel || null };

  function applyProfile() {
    var name = current.name || 'FitAI User';
    document.getElementById('name').textContent = name;
    document.getElementById('initial').textContent = (name.trim().charAt(0) || 'F').toUpperCase();
    document.getElementById('email').textContent = current.email || '—';
    document.getElementById('goalSummary').textContent = (current.goal || current.level) ? [current.goal, current.level].filter(Boolean).join(' · ') : 'Not set yet';
  }
  applyProfile();

  (async function checkAuthAndLoad() {
    if (window.FitAIAuth) {
      var guard = await window.FitAIAuth.guardPage();
      if (!guard.ok) return;
    }
    if (!window.FitAIProfile) return;
    var result = await window.FitAIProfile.getProfile();
    if (result.ok && result.data && result.data.profile) {
      var p = result.data.profile;
      current = { name: p.name, email: p.email, goal: p.fitness_goal, level: p.fitness_level };
      applyProfile();
      if (window.FitAI) {
        window.FitAI.setProfileField('name', p.name);
        window.FitAI.setProfileField('email', p.email);
      }
    }
  })();
</script>
</body>
</html>
