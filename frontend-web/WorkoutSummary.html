<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FitAI — Workout Summary</title>
<link rel="stylesheet" href="styles.css">
<script src="store.js"></script>
<script src="api-client.js"></script>
</head>
<body>
<div class="screen" style="display: flex; flex-direction: column; padding: 56px 28px 40px;">

  <h1 id="workoutName" style="margin: 0 0 6px; font-size: 26px; font-weight: 700;"></h1>
  <div id="completedAt" style="font-size: 14px; color: var(--text-secondary); margin-bottom: 28px;"></div>

  <div class="card" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 14px; color: var(--text-secondary);">Duration</div>
      <div id="durationLabel" style="font-size: 15px; font-weight: 600;"></div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 14px; color: var(--text-secondary);">Exercises</div>
      <div id="exercisesCompleted" style="font-size: 15px; font-weight: 600;"></div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 14px; color: var(--text-secondary);">Sets completed</div>
      <div id="setsCompleted" style="font-size: 15px; font-weight: 600;"></div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; gap: 12px;">
    <a href="Progress.html" class="btn-secondary" style="flex-grow: 1;">View Progress</a>
    <a href="Home.html" class="btn-primary" style="flex-grow: 1;">Return Home</a>
  </div>

</div>
<script>
  var record = window.FitAI ? window.FitAI.get().lastCompleted : null;
  var when = '—';
  if (record && record.date) {
    var d = new Date(record.date);
    when = 'Completed today at ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  document.getElementById('workoutName').textContent = record ? record.name : 'Workout';
  document.getElementById('completedAt').textContent = when;
  document.getElementById('durationLabel').textContent = record ? record.duration + ' min' : '—';
  document.getElementById('exercisesCompleted').textContent = record ? record.exercisesCompleted : 0;
  document.getElementById('setsCompleted').textContent = record ? record.setsCompleted : 0;
  (async function checkAuth() { if (window.FitAIAuth) await window.FitAIAuth.guardPage(); })();
</script>
</body>
</html>
