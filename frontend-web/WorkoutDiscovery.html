<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FitAI — Workout Discovery</title>
<link rel="stylesheet" href="styles.css">
<script src="api-client.js"></script>
</head>
<body>
<div class="screen" style="overflow: hidden;">

  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 76px; overflow-y: auto; padding: 56px 24px 24px; display: flex; flex-direction: column; gap: 20px;">

    <h1 style="margin: 0; font-size: 26px; font-weight: 700;">Workouts</h1>

    <div id="filters" style="display: flex; gap: 10px; overflow-x: auto;"></div>

    <div id="errorBanner" class="error-banner" style="display: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF6B6B" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      <span style="font-size: 12px;">Couldn't reach the workout service — showing the offline catalog.</span>
    </div>

    <div id="loading" style="display: none; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
      <div class="card" style="display:flex;flex-direction:column;gap:10px;"><div style="width:100%;height:90px;border-radius:10px;background:var(--surface-2);"></div><div style="width:70%;height:12px;border-radius:4px;background:var(--surface-2);"></div></div>
      <div class="card" style="display:flex;flex-direction:column;gap:10px;"><div style="width:100%;height:90px;border-radius:10px;background:var(--surface-2);"></div><div style="width:70%;height:12px;border-radius:4px;background:var(--surface-2);"></div></div>
    </div>

    <div id="cards" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;"></div>
    <div id="empty" style="display: none; flex-direction: column; align-items: center; gap: 10px; padding: 48px 16px; text-align: center;">
      <div style="font-size: 15px; font-weight: 600;">No workouts in this category yet</div>
      <div style="font-size: 13px; color: var(--text-secondary);">Try a different filter, or check Recommended.</div>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="Home.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>
    <a href="WorkoutDiscovery.html" class="active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 9v6M20 9v6M7 7v10M17 7v10M2 12h3M19 12h3"/></svg>Workouts</a>
    <a href="Progress.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Progress</a>
    <a href="AICoach.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8L12 2z"/></svg>AI Coach</a>
    <a href="Profile.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>Profile</a>
  </nav>

</div>
<script>
  var LOCAL_FALLBACK = [
    { id: 'upper-body-strength', name: 'Upper Body Strength', meta: '32 min · Intermediate', cat: 'strength', rec: true },
    { id: 'full-body-hiit', name: 'Full Body HIIT', meta: '20 min · Beginner', cat: 'fullbody', rec: true },
    { id: '5k-cardio-blast', name: '5K Cardio Blast', meta: '28 min · Intermediate', cat: 'cardio', rec: false },
    { id: 'lower-body-power', name: 'Lower Body Power', meta: '35 min · Advanced', cat: 'strength', rec: false },
    { id: 'morning-mobility-flow', name: 'Morning Mobility Flow', meta: '15 min · Beginner', cat: 'mobility', rec: true },
    { id: 'full-body-circuit', name: 'Full Body Circuit', meta: '40 min · Intermediate', cat: 'fullbody', rec: false }
  ];
  var FILTERS = [
    { id: 'recommended', label: 'Recommended' },
    { id: 'strength', label: 'Strength' },
    { id: 'cardio', label: 'Cardio' },
    { id: 'mobility', label: 'Mobility' },
    { id: 'fullbody', label: 'Full Body' }
  ];
  var active = 'recommended';
  var filtersEl = document.getElementById('filters');
  var cardsEl = document.getElementById('cards');
  var loadingEl = document.getElementById('loading');
  var emptyEl = document.getElementById('empty');
  var errorEl = document.getElementById('errorBanner');

  function renderFilters() {
    filtersEl.innerHTML = '';
    FILTERS.forEach(function (f) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip' + (active === f.id ? ' selected' : '');
      btn.style.whiteSpace = 'nowrap';
      btn.textContent = f.label;
      btn.addEventListener('click', function () { active = f.id; load(); });
      filtersEl.appendChild(btn);
    });
  }

  function localCards(activeId) {
    return (activeId === 'recommended' ? LOCAL_FALLBACK.filter(function (w) { return w.rec; }) : LOCAL_FALLBACK.filter(function (w) { return w.cat === activeId; }))
      .map(function (w) { return { id: w.id, name: w.name, meta: w.meta }; });
  }

  function renderCards(cards) {
    cardsEl.innerHTML = '';
    cardsEl.style.display = cards.length ? 'grid' : 'none';
    emptyEl.style.display = cards.length ? 'none' : 'flex';
    cards.forEach(function (w) {
      var a = document.createElement('a');
      a.href = 'WorkoutDetails.html?id=' + encodeURIComponent(w.id);
      a.className = 'card';
      a.style.cssText += 'display:flex;flex-direction:column;gap:10px;';
      a.innerHTML = '<div style="width:100%;height:90px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);"></div>' +
        '<div><div style="font-size:15px;font-weight:600;">' + w.name + '</div><div style="font-size:12px;color:var(--text-secondary);">' + w.meta + '</div></div>';
      cardsEl.appendChild(a);
    });
  }

  async function load() {
    renderFilters();
    loadingEl.style.display = 'grid';
    cardsEl.style.display = 'none';
    emptyEl.style.display = 'none';
    errorEl.style.display = 'none';

    if (!window.FitAICatalog) {
      loadingEl.style.display = 'none';
      renderCards(localCards(active));
      return;
    }
    var result = await window.FitAICatalog.listWorkouts(active);
    loadingEl.style.display = 'none';
    if (result.unconfigured) {
      renderCards(localCards(active));
      return;
    }
    if (!result.ok || !result.data || !Array.isArray(result.data.workouts)) {
      errorEl.style.display = 'flex';
      renderCards(localCards(active));
      return;
    }
    var cards = result.data.workouts.map(function (w) {
      return { id: w.id, name: w.title, meta: w.duration_min + ' min · ' + w.difficulty };
    });
    renderCards(cards);
  }
  load();
</script>
</body>
</html>
