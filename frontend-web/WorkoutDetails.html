<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FitAI — Workout Details</title>
<link rel="stylesheet" href="styles.css">
<script src="store.js"></script>
<script src="api-client.js"></script>
<script src="exerciseAssets.js"></script>
</head>
<body>
<div class="screen" style="overflow: hidden;">

  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 92px; overflow-y: auto; padding: 24px;">

    <a href="WorkoutDiscovery.html" aria-label="Back" class="icon-btn" style="margin-bottom: 20px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5F6F7" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
    </a>

    <div id="loading" style="display: none;">
      <div style="width: 100%; height: 180px; border-radius: 14px; background: var(--surface); margin-bottom: 20px;"></div>
      <div style="width: 60%; height: 22px; border-radius: 6px; background: var(--surface); margin-bottom: 24px;"></div>
    </div>

    <div id="content">
      <div style="width: 100%; height: 180px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; overflow: hidden;">
        <img src="assets/workout-card-default.svg" alt="" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
      <h1 id="title" style="margin: 0 0 6px; font-size: 24px; font-weight: 700;"></h1>
      <div style="display: flex; gap: 10px; margin-bottom: 24px;">
        <div id="durationChip" style="font-size: 13px; font-weight: 600; color: var(--text-secondary); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px;"></div>
        <div id="difficultyChip" style="font-size: 13px; font-weight: 600; color: var(--text-secondary); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px;"></div>
      </div>
      <div id="errorBanner" class="error-banner" style="display: none; margin-bottom: 16px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF6B6B" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <span style="font-size: 12px;">Couldn't reach the workout service — showing the offline catalog.</span>
      </div>
      <div style="font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px;">Exercises</div>
      <div id="exerciseList" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--border); padding: 16px 24px 24px; box-sizing: border-box;">
    <button type="button" id="startBtn" class="btn-primary" style="width: 100%; border: none;">Start Workout</button>
  </div>

</div>
<script>
  var LOCAL_WORKOUTS = {
    'upper-body-strength': { title: 'Upper Body Strength', duration_min: 32, difficulty: 'Intermediate',
      exercises: [{ name: 'Bench Press', sets: 3, reps: 10, weight: 60 }, { name: 'Dumbbell Row', sets: 3, reps: 12, weight: 20 }, { name: 'Overhead Press', sets: 3, reps: 8, weight: 35 }] },
    'full-body-hiit': { title: 'Full Body HIIT', duration_min: 20, difficulty: 'Beginner',
      exercises: [{ name: 'Jumping Jacks', sets: 3, reps: 30, weight: null }, { name: 'Bodyweight Squat', sets: 3, reps: 15, weight: null }, { name: 'Push-Up', sets: 3, reps: 10, weight: null }, { name: 'Mountain Climbers', sets: 3, reps: 20, weight: null }] },
    '5k-cardio-blast': { title: '5K Cardio Blast', duration_min: 28, difficulty: 'Intermediate',
      exercises: [{ name: 'Jumping Jacks', sets: 4, reps: 30, weight: null }, { name: 'Mountain Climbers', sets: 4, reps: 25, weight: null }, { name: 'Kettlebell/DB Swing', sets: 3, reps: 15, weight: 16 }] },
    'lower-body-power': { title: 'Lower Body Power', duration_min: 35, difficulty: 'Advanced',
      exercises: [{ name: 'Goblet Squat', sets: 4, reps: 8, weight: 40 }, { name: 'Kettlebell/DB Swing', sets: 3, reps: 15, weight: 24 }, { name: 'Bodyweight Squat', sets: 3, reps: 20, weight: null }] },
    'morning-mobility-flow': { title: 'Morning Mobility Flow', duration_min: 15, difficulty: 'Beginner',
      exercises: [{ name: 'Plank', sets: 3, reps: 30, weight: null }, { name: 'Bodyweight Squat', sets: 2, reps: 15, weight: null }, { name: 'Push-Up', sets: 2, reps: 10, weight: null }] },
    'full-body-circuit': { title: 'Full Body Circuit', duration_min: 40, difficulty: 'Intermediate',
      exercises: [{ name: 'Push-Up', sets: 3, reps: 15, weight: null }, { name: 'Bodyweight Squat', sets: 3, reps: 20, weight: null }, { name: 'Mountain Climbers', sets: 3, reps: 20, weight: null }, { name: 'Jumping Jacks', sets: 3, reps: 30, weight: null }] }
  };
  var params = new URLSearchParams(window.location.search);
  var workoutId = params.get('id') || 'upper-body-strength';
  var currentWorkout = null;

  function localWorkout() {
    var w = LOCAL_WORKOUTS[workoutId] || LOCAL_WORKOUTS['upper-body-strength'];
    return { id: workoutId, title: w.title, duration_min: w.duration_min, difficulty: w.difficulty, exercises: w.exercises };
  }

  function renderWorkout(w) {
    currentWorkout = w;
    document.getElementById('title').textContent = w.title;
    document.getElementById('durationChip').textContent = w.duration_min + ' min';
    document.getElementById('difficultyChip').textContent = w.difficulty;
    var list = document.getElementById('exerciseList');
    list.innerHTML = '';
    (w.exercises || []).forEach(function (ex) {
      var row = document.createElement('div');
      row.className = 'card';
      row.style.cssText += 'display:flex;align-items:center;justify-content:space-between;padding:14px 16px;';
      var iconSrc = window.FitAIAssets ? window.FitAIAssets.getExerciseAsset(ex.name) : 'assets/exercises/default.svg';
      row.innerHTML = '<div style="display:flex;align-items:center;gap:12px;"><img src="' + iconSrc + '" alt="" style="width:36px;height:36px;border-radius:8px;"><div style="font-size:15px;font-weight:600;">' + ex.name + '</div></div><div style="font-size:13px;color:var(--text-secondary);">' + ex.sets + ' × ' + ex.reps + '</div>';
      list.appendChild(row);
    });
  }

  async function load() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('content').style.display = 'none';
    if (!window.FitAICatalog) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      renderWorkout(localWorkout());
      return;
    }
    var result = await window.FitAICatalog.getWorkout(workoutId);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    if (result.unconfigured) { renderWorkout(localWorkout()); return; }
    if (!result.ok || !result.data) {
      document.getElementById('errorBanner').style.display = 'flex';
      renderWorkout(localWorkout());
      return;
    }
    renderWorkout({ id: result.data.id, title: result.data.title, duration_min: result.data.duration_min, difficulty: result.data.difficulty, exercises: result.data.exercises });
  }

  document.getElementById('startBtn').addEventListener('click', async function () {
    var btn = this;
    btn.textContent = 'Starting workout…';
    btn.disabled = true;
    var w = currentWorkout || localWorkout();
    if (window.FitAI) {
      window.FitAI.startWorkout({ id: w.id, title: w.title, duration: w.duration_min + ' min', difficulty: w.difficulty, exercises: w.exercises });
    }
    if (window.FitAISessions) {
      var result = await window.FitAISessions.startSession(w.id);
      if (result.ok && result.data && result.data.session && window.FitAI) {
        window.FitAI.setCurrentWorkoutBackendSessionId(result.data.session.id);
      }
    }
    window.location.href = 'ActiveWorkout.html';
  });

  (async function checkAuthAndLoad() {
    if (window.FitAIAuth) {
      var guard = await window.FitAIAuth.guardPage();
      if (!guard.ok) return;
    }
    load();
  })();
</script>
</body>
</html>
