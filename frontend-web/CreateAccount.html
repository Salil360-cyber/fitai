<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FitAI — Create Account</title>
<link rel="stylesheet" href="styles.css">
<script src="store.js"></script>
<script src="api-client.js"></script>
</head>
<body>
<div class="screen" style="display: flex; flex-direction: column; padding: 24px 28px 40px;">

  <a href="Welcome.html" aria-label="Back" class="icon-btn" style="margin-bottom: 28px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5F6F7" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
  </a>

  <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 32px;">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700;">Create your account</h1>
    <div style="font-size: 15px; color: var(--text-secondary);">Takes less than a minute.</div>
  </div>

  <form id="form" style="display: flex; flex-direction: column; gap: 18px; flex-grow: 1;" onsubmit="return false;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="name" style="font-size: 13px; font-weight: 600; color: var(--text-secondary);">Name</label>
      <input id="name" type="text" placeholder="Your name" class="input-field">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="email" style="font-size: 13px; font-weight: 600; color: var(--text-secondary);">Email</label>
      <input id="email" type="email" placeholder="you@example.com" class="input-field">
      <div id="emailError" style="font-size: 12px; color: var(--error); display: none;">Enter a valid email address</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="password" style="font-size: 13px; font-weight: 600; color: var(--text-secondary);">Password</label>
      <input id="password" type="password" placeholder="At least 8 characters" class="input-field">
      <div id="passwordError" style="font-size: 12px; color: var(--error); display: none;">Password must be at least 8 characters</div>
    </div>
  </form>

  <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 24px;">
    <a href="FitnessGoal.html" id="continueBtn" class="btn-primary btn-disabled" style="pointer-events: none;">Continue</a>
    <div style="text-align: center; font-size: 14px; color: var(--text-secondary);">Already have an account? <a href="LoginScreen.html" style="color: var(--text-primary); font-weight: 600; text-decoration: underline;">Log In</a></div>
  </div>

</div>
<script>
  var nameEl = document.getElementById('name');
  var emailEl = document.getElementById('email');
  var passwordEl = document.getElementById('password');
  var emailError = document.getElementById('emailError');
  var passwordError = document.getElementById('passwordError');
  var continueBtn = document.getElementById('continueBtn');

  function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  function revalidate() {
    var nameValid = nameEl.value.trim().length > 0;
    var emailValid = isValidEmail(emailEl.value);
    var passwordValid = passwordEl.value.length >= 8;
    emailError.style.display = (emailEl.value.length > 0 && !emailValid) ? 'block' : 'none';
    passwordError.style.display = (passwordEl.value.length > 0 && !passwordValid) ? 'block' : 'none';
    var canContinue = nameValid && emailValid && passwordValid;
    continueBtn.classList.toggle('btn-disabled', !canContinue);
    continueBtn.style.pointerEvents = canContinue ? 'auto' : 'none';
  }
  [nameEl, emailEl, passwordEl].forEach(function (el) { el.addEventListener('input', revalidate); });

  continueBtn.addEventListener('click', function () {
    if (window.FitAI) {
      window.FitAI.setProfileField('name', nameEl.value);
      window.FitAI.setProfileField('email', emailEl.value);
    }
    if (window.FitAIAuth) {
      // Fire-and-forget: does not block navigation. Establishes the
      // real account+session in the background.
      window.FitAIAuth.register(nameEl.value, emailEl.value, passwordEl.value);
    }
  });
</script>
</body>
</html>
