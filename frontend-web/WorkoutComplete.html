<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FitAI — Workout Complete</title>
<link rel="stylesheet" href="styles.css">
<script src="store.js"></script>
<script src="api-client.js"></script>
</head>
<body>
<div class="screen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 32px;">

  <div style="width: 72px; height: 72px; border-radius: 50%; background: var(--lime); display: flex; align-items: center; justify-content: center;">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0B0C0E" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
  </div>

  <div style="font-size: 24px; font-weight: 700; text-align: center;">Workout Complete!</div>
  <div style="font-size: 14px; color: var(--text-secondary); text-align: center;">Workout added to your history.</div>

  <div style="display: flex; gap: 24px; margin-top: 8px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <div id="durationLabel" style="font-size: 18px; font-weight: 700;">—</div>
      <div style="font-size: 12px; color: var(--text-tertiary);">duration</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <div id="setsCompleted" style="font-size: 18px; font-weight: 700;">0</div>
      <div style="font-size: 12px; color: var(--text-tertiary);">sets logged</div>
    </div>
  </div>

  <a href="WorkoutSummary.html" class="btn-primary" style="width: 100%; margin-top: 16px;">Continue</a>

</div>
<script>
  var record = window.FitAI ? window.FitAI.get().lastCompleted : null;
  document.getElementById('durationLabel').textContent = record ? record.duration + ' min' : '—';
  document.getElementById('setsCompleted').textContent = record ? record.setsCompleted : 0;
  (async function checkAuth() { if (window.FitAIAuth) await window.FitAIAuth.guardPage(); })();
</script>
</body>
</html>
