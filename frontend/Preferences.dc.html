<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FitAI — Preferences</title>
<script src="./support.js"></script>
<script src="./store.js"></script>
<script src="./api-client.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#0B0C0E}
a{text-decoration:none}
button{font-family:'Inter',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0C0E; display: flex; flex-direction: column; padding: 24px 28px 40px;">

  <a href="{{backHref}}" aria-label="Back" style="width: 40px; height: 40px; border-radius: 10px; background: #17181B; border: 1px solid #2B2D31; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5F6F7" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
  </a>

  <div style="display: flex; gap: 8px; margin-bottom: 24px;">
    <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #C6FF4D;"></div>
    <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #C6FF4D;"></div>
    <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #C6FF4D;"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 28px;">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; color: #F5F6F7;">What do you like to do?</h1>
    <div style="font-size: 15px; color: #9BA1A8;">Pick as many as you like — you can change this later.</div>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 10px; flex-grow: 1; align-content: flex-start;">
    <sc-for list="{{options}}" as="opt" hint-placeholder-count="5">
      <button type="button" onClick="{{opt.pick}}" style="{{opt.chipStyle}}">{{opt.label}}</button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 20px;">
    <a href="{{continueHref}}" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 12px; background: #C6FF4D; color: #0B0C0E; font-size: 16px; font-weight: 700;">{{continueLabel}}</a>
    <div style="text-align: center; font-size: 14px; color: #9BA1A8;">{{captionText}}</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var saved = window.FitAI ? window.FitAI.get().profile.preferences : {};
    this.state = { selected: saved || {} };
  }
  prefLabels() {
    return [
      { id: 'strength', label: 'Strength' },
      { id: 'cardio', label: 'Cardio' },
      { id: 'mobility', label: 'Mobility' },
      { id: 'fullbody', label: 'Full Body' },
      { id: 'outdoor', label: 'Outdoor' }
    ];
  }
  toggle(id) {
    const next = { ...this.state.selected, [id]: !this.state.selected[id] };
    this.setState({ selected: next });
    if (window.FitAI) {
      window.FitAI.togglePreference(id);
    }
    if (window.FitAIProfile) {
      var labels = this.prefLabels().filter((o) => next[o.id]).map((o) => o.label);
      window.FitAIProfile.updateProfile({ preferences: labels });
    }
  }
  renderVals() {
    const base = this.prefLabels();
    const options = base.map((o) => {
      const isSelected = !!this.state.selected[o.id];
      return {
        id: o.id,
        label: o.label,
        pick: () => this.toggle(o.id),
        chipStyle: isSelected
          ? 'height:44px;padding:0 18px;border-radius:999px;background:#C6FF4D;color:#0B0C0E;font-size:14px;font-weight:600;border:none;'
          : 'height:44px;padding:0 18px;border-radius:999px;background:#17181B;color:#F5F6F7;font-size:14px;font-weight:600;border:1.5px solid #2B2D31;'
      };
    });
    const fromProfile = typeof window !== 'undefined' && window.location.search.indexOf('from=profile') !== -1;
    return {
      options,
      backHref: fromProfile ? 'Profile.dc.html' : 'FitnessLevel.dc.html',
      continueHref: fromProfile ? 'Profile.dc.html' : 'Home.dc.html',
      continueLabel: fromProfile ? 'Save' : 'Continue',
      captionText: fromProfile ? 'Your preferences are saved automatically.' : 'Preferences are optional — you can skip this step.'
    };
  }
}
</script>
</body>
</html>
