<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var saved = window.FitAI ? window.FitAI.get().profile : {};
    this.state = {
      name: saved.name || '',
      email: saved.email || '',
      goal: saved.fitnessGoal || null,
      level: saved.fitnessLevel || null
    };
  }
  componentDidMount() {
    this.checkAuthAndLoad();
  }
  async checkAuthAndLoad() {
    if (window.FitAIAuth) {
      var guard = await window.FitAIAuth.guardPage();
      if (!guard.ok) return; // already redirecting to Login
    }
    if (!window.FitAIProfile) return;
    var result = await window.FitAIProfile.getProfile();
    if (result.ok && result.data && result.data.profile) {
      // Phase 2.6: backend is authoritative for the profile display.
      var p = result.data.profile;
      this.setState({ name: p.name, email: p.email, goal: p.fitness_goal, level: p.fitness_level });
      if (window.FitAI) {
        window.FitAI.setProfileField('name', p.name);
        window.FitAI.setProfileField('email', p.email);
      }
    }
    // unconfigured/offline/failed: silently keep the local-fallback
    // values already shown from the constructor above.
  }
  renderVals() {
    var name = this.state.name || 'FitAI User';
    var initial = name.trim().charAt(0).toUpperCase() || 'F';
    var goalSummary = this.state.goal || this.state.level
      ? [this.state.goal, this.state.level].filter(Boolean).join(' · ')
      : 'Not set yet';
    return {
      name: name,
      email: this.state.email || '—',
      initial: initial,
      goalSummary: goalSummary
    };
  }
}
</script>
