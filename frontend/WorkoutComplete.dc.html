<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FitAI — Workout Complete</title>
<script src="./support.js"></script>
<script src="./store.js"></script>
<script src="./api-client.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#0B0C0E}
a{text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0C0E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 32px; box-sizing: border-box;">

  <div style="width: 72px; height: 72px; border-radius: 50%; background: #C6FF4D; display: flex; align-items: center; justify-content: center;">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0B0C0E" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
  </div>

  <div style="font-size: 24px; font-weight: 700; color: #F5F6F7; text-align: center;">Workout Complete!</div>
  <div style="font-size: 14px; color: #9BA1A8; text-align: center;">Workout added to your history.</div>

  <div style="display: flex; gap: 24px; margin-top: 8px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <div style="font-size: 18px; font-weight: 700; color: #F5F6F7;">{{durationLabel}}</div>
      <div style="font-size: 12px; color: #6B7178;">duration</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <div style="font-size: 18px; font-weight: 700; color: #F5F6F7;">{{setsCompleted}}</div>
      <div style="font-size: 12px; color: #6B7178;">sets logged</div>
    </div>
  </div>

  <a href="WorkoutSummary.dc.html" style="width: 100%; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 12px; background: #C6FF4D; color: #0B0C0E; font-size: 16px; font-weight: 700; margin-top: 16px;">Continue</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    if (window.FitAIAuth) window.FitAIAuth.guardPage();
  }
  renderVals() {
    var record = window.FitAI ? window.FitAI.get().lastCompleted : null;
    return {
      durationLabel: record ? record.duration + ' min' : '—',
      setsCompleted: record ? record.setsCompleted : 0
    };
  }
}
</script>
</body>
</html>
