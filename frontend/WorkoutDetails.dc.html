<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FitAI — Workout Details</title>
<script src="./support.js"></script>
<script src="./store.js"></script>
<script src="./api-client.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#0B0C0E}
a{text-decoration:none}
button{font-family:'Inter',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0C0E; position: relative; overflow: hidden;">

  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 92px; overflow-y: auto; padding: 24px 24px 24px;">

    <a href="WorkoutDiscovery.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 10px; background: #17181B; border: 1px solid #2B2D31; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5F6F7" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
    </a>

    <sc-if value="{{showLoading}}" hint-placeholder-val="{{false}}">
      <div style="width: 100%; height: 180px; border-radius: 14px; background: #17181B; border: 1px solid #2B2D31; margin-bottom: 20px;"></div>
      <div style="width: 60%; height: 22px; border-radius: 6px; background: #17181B; margin-bottom: 24px;"></div>
    </sc-if>

    <sc-if value="{{showContent}}" hint-placeholder-val="{{true}}">
      <div style="width: 100%; height: 180px; border-radius: 14px; background: #17181B; border: 1px solid #2B2D31; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #6B7178; margin-bottom: 20px;">[workout image]</div>

      <h1 style="margin: 0 0 6px; font-size: 24px; font-weight: 700; color: #F5F6F7;">{{workout.title}}</h1>
      <div style="display: flex; gap: 10px; margin-bottom: 24px;">
        <div style="font-size: 13px; font-weight: 600; color: #9BA1A8; background: #17181B; border: 1px solid #2B2D31; border-radius: 999px; padding: 6px 12px;">{{workout.durationLabel}}</div>
        <div style="font-size: 13px; font-weight: 600; color: #9BA1A8; background: #17181B; border: 1px solid #2B2D31; border-radius: 999px; padding: 6px 12px;">{{workout.difficulty}}</div>
      </div>

      <sc-if value="{{showError}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; align-items: center; gap: 10px; background: #17181B; border: 1px solid #FF6B6B; border-radius: 12px; padding: 12px 14px; margin-bottom: 16px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF6B6B" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
          <div style="font-size: 12px; color: #9BA1A8;">Couldn't reach the workout service — showing the offline catalog.</div>
        </div>
      </sc-if>

      <div style="font-size: 13px; font-weight: 600; color: #9BA1A8; margin-bottom: 12px;">Exercises</div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <sc-for list="{{workout.exerciseRows}}" as="ex" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; justify-content: space-between; background: #17181B; border: 1px solid #2B2D31; border-radius: 12px; padding: 14px 16px;">
            <div style="font-size: 15px; font-weight: 600; color: #F5F6F7;">{{ex.name}}</div>
            <div style="font-size: 13px; color: #9BA1A8;">{{ex.setsLabel}}</div>
          </div>
        </sc-for>
      </div>
    </sc-if>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #0B0C0E; border-top: 1px solid #2B2D31; padding: 16px 24px 24px; box-sizing: border-box;">
    <button type="button" onClick="{{startFn}}" style="{{startStyle}}">{{startLabel}}</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
/*
 * Phase 2.2: renders whichever workout_id was passed via
 * ?id=... (same query-string pattern Preferences.dc.html already uses
 * for ?from=profile), fetched from GET /workouts/:id. LOCAL_WORKOUTS
 * mirrors the backend's seed data exactly, used as the offline
 * fallback so every catalog entry — not just Upper Body Strength —
 * still renders correctly when no API is configured.
 */
var LOCAL_WORKOUTS = {
  'upper-body-strength': { title: 'Upper Body Strength', duration_min: 32, difficulty: 'Intermediate',
    exercises: [{ name: 'Bench Press', sets: 3, reps: 10, weight: 60 }, { name: 'Dumbbell Row', sets: 3, reps: 12, weight: 20 }, { name: 'Overhead Press', sets: 3, reps: 8, weight: 35 }] },
  'full-body-hiit': { title: 'Full Body HIIT', duration_min: 20, difficulty: 'Beginner',
    exercises: [{ name: 'Jumping Jacks', sets: 3, reps: 30, weight: null }, { name: 'Bodyweight Squat', sets: 3, reps: 15, weight: null }, { name: 'Push-Up', sets: 3, reps: 10, weight: null }, { name: 'Mountain Climbers', sets: 3, reps: 20, weight: null }] },
  '5k-cardio-blast': { title: '5K Cardio Blast', duration_min: 28, difficulty: 'Intermediate',
    exercises: [{ name: 'Jumping Jacks', sets: 4, reps: 30, weight: null }, { name: 'Mountain Climbers', sets: 4, reps: 25, weight: null }, { name: 'Kettlebell/DB Swing', sets: 3, reps: 15, weight: 16 }] },
  'lower-body-power': { title: 'Lower Body Power', duration_min: 35, difficulty: 'Advanced',
    exercises: [{ name: 'Goblet Squat', sets: 4, reps: 8, weight: 40 }, { name: 'Kettlebell/DB Swing', sets: 3, reps: 15, weight: 24 }, { name: 'Bodyweight Squat', sets: 3, reps: 20, weight: null }] },
  'morning-mobility-flow': { title: 'Morning Mobility Flow', duration_min: 15, difficulty: 'Beginner',
    exercises: [{ name: 'Plank', sets: 3, reps: 30, weight: null }, { name: 'Bodyweight Squat', sets: 2, reps: 15, weight: null }, { name: 'Push-Up', sets: 2, reps: 10, weight: null }] },
  'full-body-circuit': { title: 'Full Body Circuit', duration_min: 40, difficulty: 'Intermediate',
    exercises: [{ name: 'Push-Up', sets: 3, reps: 15, weight: null }, { name: 'Bodyweight Squat', sets: 3, reps: 20, weight: null }, { name: 'Mountain Climbers', sets: 3, reps: 20, weight: null }, { name: 'Jumping Jacks', sets: 3, reps: 30, weight: null }] }
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    var params = new URLSearchParams(window.location.search);
    this.workoutId = params.get('id') || 'upper-body-strength';
    this.state = { workout: null, loading: true, error: false, starting: false };
  }
  componentDidMount() {
    this.checkAuthAndLoad();
  }
  async checkAuthAndLoad() {
    if (window.FitAIAuth) {
      var guard = await window.FitAIAuth.guardPage();
      if (!guard.ok) return; // already redirecting to Login
    }
    this.load();
  }
  localWorkout() {
    var w = LOCAL_WORKOUTS[this.workoutId] || LOCAL_WORKOUTS['upper-body-strength'];
    return { id: this.workoutId, title: w.title, duration_min: w.duration_min, difficulty: w.difficulty, exercises: w.exercises };
  }
  async load() {
    this.setState({ loading: true, error: false });
    if (!window.FitAICatalog) {
      this.setState({ workout: this.localWorkout(), loading: false, error: false });
      return;
    }
    var result = await window.FitAICatalog.getWorkout(this.workoutId);
    if (result.unconfigured) {
      this.setState({ workout: this.localWorkout(), loading: false, error: false });
      return;
    }
    if (!result.ok || !result.data) {
      this.setState({ workout: this.localWorkout(), loading: false, error: true });
      return;
    }
    this.setState({
      workout: { id: result.data.id, title: result.data.title, duration_min: result.data.duration_min, difficulty: result.data.difficulty, exercises: result.data.exercises },
      loading: false,
      error: false
    });
  }
  async start(w) {
    if (this.state.starting) return;
    this.setState({ starting: true });
    // Local fallback path is preserved unconditionally — this exact call
    // already worked before Phase 2.3 and keeps working offline.
    if (window.FitAI) {
      window.FitAI.startWorkout({
        id: w.id,
        title: w.title,
        duration: w.duration_min + ' min',
        difficulty: w.difficulty,
        exercises: w.exercises
      });
    }
    if (window.FitAISessions) {
      var result = await window.FitAISessions.startSession(w.id);
      if (result.ok && result.data && result.data.session && window.FitAI) {
        window.FitAI.setCurrentWorkoutBackendSessionId(result.data.session.id);
      }
      // unconfigured / offline / failed: silently continue on the local
      // fallback already saved above — Active Workout still works fully.
    }
    window.location.href = 'ActiveWorkout.dc.html';
  }
  renderVals() {
    var w = this.state.workout || this.localWorkout();
    var exerciseRows = (w.exercises || []).map(function (ex) {
      return { name: ex.name, setsLabel: ex.sets + ' × ' + ex.reps };
    });
    return {
      showLoading: this.state.loading,
      showContent: !this.state.loading,
      showError: this.state.error,
      workout: { title: w.title, durationLabel: w.duration_min + ' min', difficulty: w.difficulty, exerciseRows },
      startLabel: this.state.starting ? 'Starting workout…' : 'Start Workout',
      startStyle: this.state.starting
        ? 'display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:12px;background:#3A3C40;color:#6B7178;font-size:16px;font-weight:700;border:none;box-sizing:border-box;'
        : 'display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:12px;background:#C6FF4D;color:#0B0C0E;font-size:16px;font-weight:700;border:none;box-sizing:border-box;',
      startFn: () => this.start(w)
    };
  }
}
</script>
</body>
</html>
