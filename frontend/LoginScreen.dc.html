<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FitAI — Log In</title>
<script src="./support.js"></script>
<script src="./store.js"></script>
<script src="./api-client.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#0B0C0E}
a{text-decoration:none}
input{outline:none;font-family:'Inter',sans-serif}
input::placeholder{color:#6B7178}
button{font-family:'Inter',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0C0E; display: flex; flex-direction: column; padding: 24px 28px 40px;">

  <a href="Welcome.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 10px; background: #17181B; border: 1px solid #2B2D31; display: flex; align-items: center; justify-content: center; margin-bottom: 28px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5F6F7" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
  </a>

  <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 32px;">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; color: #F5F6F7;">Log in</h1>
    <div style="font-size: 15px; color: #9BA1A8;">Welcome back.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px; flex-grow: 1;">

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="email" style="font-size: 13px; font-weight: 600; color: #9BA1A8;">Email</label>
      <input id="email" type="email" placeholder="you@example.com" value="{{email}}" onChange="{{onEmailChange}}" style="height: 52px; border-radius: 12px; background: #1E2023; border: 1px solid #2B2D31; color: #F5F6F7; font-size: 15px; padding: 0 16px; box-sizing: border-box;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="password" style="font-size: 13px; font-weight: 600; color: #9BA1A8;">Password</label>
      <input id="password" type="password" placeholder="Your password" value="{{password}}" onChange="{{onPasswordChange}}" style="height: 52px; border-radius: 12px; background: #1E2023; border: 1px solid #2B2D31; color: #F5F6F7; font-size: 15px; padding: 0 16px; box-sizing: border-box;">
    </div>

    <sc-if value="{{showError}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; align-items: center; gap: 10px; background: #17181B; border: 1px solid #FF6B6B; border-radius: 12px; padding: 14px 16px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF6B6B" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <div style="font-size: 13px; color: #F5F6F7;">{{errorMessage}}</div>
      </div>
    </sc-if>

  </div>

  <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 24px;">
    <button type="button" onClick="{{submitFn}}" style="{{submitStyle}}">{{submitLabel}}</button>
    <div style="text-align: center; font-size: 14px; color: #9BA1A8;">Don't have an account? <a href="CreateAccount.dc.html" style="color: #F5F6F7; font-weight: 600; text-decoration: underline;">Create one</a></div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { email: '', password: '', submitting: false, error: null };
  }
  async submit() {
    if (this.state.submitting) return;
    this.setState({ submitting: true, error: null });
    if (!window.FitAIAuth) {
      this.setState({ submitting: false, error: 'Login service is not available in this preview.' });
      return;
    }
    var redirectTo = new URLSearchParams(window.location.search).get('redirect') || 'Home.dc.html';
    var result = await window.FitAIAuth.login(this.state.email, this.state.password);
    if (result.offline) {
      this.setState({
        submitting: false,
        error: 'Backend not connected yet — this Login screen is wired to call the real API once one is deployed and window.FITAI_API_BASE is set. Continuing with the local prototype for now.'
      });
      // Local-prototype fallback: existing onboarding/local data is untouched;
      // proceed into the app exactly as the current prototype already does.
      window.location.href = redirectTo;
      return;
    }
    if (!result.ok) {
      var msg = (result.data && result.data.error) || 'Invalid email or password.';
      this.setState({ submitting: false, error: msg });
      return;
    }
    // Phase 2.6: the backend profile is authoritative for a returning
    // user — fixes the Phase 2.5-noted gap where only email (not name)
    // was ever restored locally after a plain login.
    if (window.FitAIProfile && window.FitAI) {
      var profileResult = await window.FitAIProfile.getProfile();
      if (profileResult.ok && profileResult.data && profileResult.data.profile) {
        var p = profileResult.data.profile;
        window.FitAI.setProfileField('name', p.name);
        window.FitAI.setProfileField('email', p.email);
        if (p.fitness_goal) window.FitAI.setProfileField('fitnessGoal', p.fitness_goal);
        if (p.fitness_level) window.FitAI.setProfileField('fitnessLevel', p.fitness_level);
      }
    } else if (window.FitAI && result.data && result.data.user) {
      window.FitAI.setProfileField('email', result.data.user.email);
    }
    window.location.href = redirectTo;
  }
  renderVals() {
    var hasInput = this.state.email.length > 0 && this.state.password.length > 0;
    return {
      email: this.state.email,
      password: this.state.password,
      onEmailChange: (e) => this.setState({ email: e.target.value }),
      onPasswordChange: (e) => this.setState({ password: e.target.value }),
      showError: !!this.state.error,
      errorMessage: this.state.error || '',
      submitLabel: this.state.submitting ? 'Logging in…' : 'Log In',
      submitFn: () => this.submit(),
      submitStyle: hasInput
        ? 'display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:12px;background:#C6FF4D;color:#0B0C0E;font-size:16px;font-weight:700;border:none;box-sizing:border-box;'
        : 'display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:12px;background:#3A3C40;color:#6B7178;font-size:16px;font-weight:700;border:none;box-sizing:border-box;'
    };
  }
}
</script>
</body>
</html>
