<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FitAI — Create Account</title>
<script src="./support.js"></script>
<script src="./store.js"></script>
<script src="./api-client.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#0B0C0E}
a{text-decoration:none}
input{outline:none;font-family:'Inter',sans-serif}
input::placeholder{color:#6B7178}
button{font-family:'Inter',sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0C0E; display: flex; flex-direction: column; padding: 24px 28px 40px;">

  <a href="Welcome.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 10px; background: #17181B; border: 1px solid #2B2D31; display: flex; align-items: center; justify-content: center; margin-bottom: 28px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5F6F7" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
  </a>

  <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 32px;">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; color: #F5F6F7;">Create your account</h1>
    <div style="font-size: 15px; color: #9BA1A8;">Takes less than a minute.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px; flex-grow: 1;">

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="name" style="font-size: 13px; font-weight: 600; color: #9BA1A8;">Name</label>
      <input id="name" type="text" placeholder="Your name" value="{{name}}" onChange="{{onNameChange}}" style="{{nameStyle}}">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="email" style="font-size: 13px; font-weight: 600; color: #9BA1A8;">Email</label>
      <input id="email" type="email" placeholder="you@example.com" value="{{email}}" onChange="{{onEmailChange}}" style="{{emailStyle}}">
      <sc-if value="{{emailError}}" hint-placeholder-val="{{false}}">
        <div style="font-size: 12px; color: #FF6B6B;">Enter a valid email address</div>
      </sc-if>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="password" style="font-size: 13px; font-weight: 600; color: #9BA1A8;">Password</label>
      <input id="password" type="password" placeholder="At least 8 characters" value="{{password}}" onChange="{{onPasswordChange}}" style="{{passwordStyle}}">
      <sc-if value="{{passwordError}}" hint-placeholder-val="{{false}}">
        <div style="font-size: 12px; color: #FF6B6B;">Password must be at least 8 characters</div>
      </sc-if>
    </div>

  </div>

  <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 24px;">
    <sc-if value="{{canContinue}}" hint-placeholder-val="{{false}}">
      <a href="FitnessGoal.dc.html" onClick="{{saveAndContinue}}" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 12px; background: #C6FF4D; color: #0B0C0E; font-size: 16px; font-weight: 700;">Continue</a>
    </sc-if>
    <sc-if value="{{cannotContinue}}" hint-placeholder-val="{{true}}">
      <button type="button" disabled style="display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; border-radius: 12px; background: #3A3C40; color: #6B7178; font-size: 16px; font-weight: 700; border: none; box-sizing: border-box;">Continue</button>
    </sc-if>
    <div style="text-align: center; font-size: 14px; color: #9BA1A8;">Already have an account? <a href="LoginScreen.dc.html" style="color: #F5F6F7; font-weight: 600; text-decoration: underline;">Log In</a></div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var saved = window.FitAI ? window.FitAI.get().profile : { name: '', email: '' };
    this.state = { name: saved.name || '', email: saved.email || '', password: '' };
  }
  isValidEmail(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }
  renderVals() {
    const name = this.state.name;
    const email = this.state.email;
    const password = this.state.password;
    const nameValid = name.trim().length > 0;
    const emailValid = this.isValidEmail(email);
    const passwordValid = password.length >= 8;
    const emailError = email.length > 0 && !emailValid;
    const passwordError = password.length > 0 && !passwordValid;
    const canContinue = nameValid && emailValid && passwordValid;
    const baseInput = 'height:52px;border-radius:12px;background:#1E2023;color:#F5F6F7;font-size:15px;padding:0 16px;box-sizing:border-box;border:1px solid #2B2D31;';
    const errorInput = 'height:52px;border-radius:12px;background:#1E2023;color:#F5F6F7;font-size:15px;padding:0 16px;box-sizing:border-box;border:1.5px solid #FF6B6B;';
    return {
      name, email, password,
      onNameChange: (e) => this.setState({ name: e.target.value }),
      onEmailChange: (e) => this.setState({ email: e.target.value }),
      onPasswordChange: (e) => this.setState({ password: e.target.value }),
      nameStyle: baseInput,
      emailStyle: emailError ? errorInput : baseInput,
      passwordStyle: passwordError ? errorInput : baseInput,
      emailError,
      passwordError,
      canContinue,
      cannotContinue: !canContinue,
      saveAndContinue: () => {
        if (window.FitAI) {
          window.FitAI.setProfileField('name', this.state.name);
          window.FitAI.setProfileField('email', this.state.email);
        }
        if (window.FitAIAuth) {
          // Fire-and-forget: does not block the existing local onboarding
          // flow. Once a real API base is configured this establishes a
          // real server-side account+session in the background; until
          // then it resolves as offline and does nothing further.
          window.FitAIAuth.register(this.state.name, this.state.email, this.state.password);
        }
      }
    };
  }
}
</script>
</body>
</html>
